name: TWRP Recovery Builder 2024

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'TWRP Minimal-Manifest Branch'
        required: true
        default: 'twrp-14.1'
        type: choice
        options:
        - twrp-14.1
        - twrp-12.1
        - twrp-11
        - twrp-9.0

      DEVICE_TREE:
        description: 'Device Tree URL'
        required: true
        default: 'https://github.com/mkpromvp/Recovery-tree-for-SM-A146P-.git'

      DEVICE_TREE_BRANCH:
        required: true
        default: 'main'

      DEVICE_PATH:
        required: true
        default: 'device/samsung/a14xm'

      DEVICE_NAME:
        required: true
        default: 'a14xm'

      BUILD_TARGET:
        required: true
        default: 'recovery'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot

      RECOVERY_TAR:
        required: false
        default: false
        type: boolean

      RECOVERY_INSTALLER:
        required: true
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup environment
      run: |
        sudo apt update
        sudo apt install -y git wget zip bc bison build-essential flex g++-multilib gcc-multilib libc6-dev-i386 lib32ncurses5-dev lib32z1-dev liblz4-tool python3

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: 8

    - name: Install repo tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Init workspace
      run: |
        mkdir workspace
        cd workspace
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b ${{ github.event.inputs.MANIFEST_BRANCH }}

    - name: Sync repo
      run: |
        cd workspace
        repo sync -j$(nproc --all) --force-sync

    - name: Clone device tree
      run: |
        cd workspace
        git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ${{ github.event.inputs.DEVICE_PATH }}

    # 🔥 FIXED: forced correct lunch combo (no more guessing)
    - name: Set Build Config
      run: |
        echo "DEVICE_MAKEFILE=twrp_a14xm" >> $GITHUB_ENV

    - name: Build recovery
      run: |
        cd workspace
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch twrp_a14xm-eng
        make clean
        make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)

    - name: Verify output
      run: |
        cd workspace
        if [ ! -f out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery.img ]; then
          echo "ERROR: recovery.img not found!"
          exit 1
        fi
        echo "RECOVERY_TYPE=recovery" >> $GITHUB_ENV

    - name: Generate MD5
      run: |
        cd workspace
        md5sum out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery.img > md5.txt

    - name: Upload Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery.img
          workspace/md5.txt
        name: TWRP ${{ github.event.inputs.DEVICE_NAME }}
        tag_name: ${{ github.run_id }}
